<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kande VendTech — Office Inventory</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-vend-32.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #f8fafc; --card: #ffffff; --border: #e2e8f0; --text: #0f172a;
      --muted: #64748b; --accent: #3b82f6; --accent-light: #eff6ff;
      --green: #22c55e; --green-light: #f0fdf4;
      --amber: #f59e0b; --amber-light: #fffbeb;
      --red: #ef4444; --red-light: #fef2f2;
      --purple: #8b5cf6; --purple-light: #f5f3ff;
      --teal: #14b8a6; --teal-light: #f0fdfa;
      --radius: 12px;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
      --shadow: 0 4px 12px rgba(0,0,0,0.06);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.5;
      -webkit-tap-highlight-color: transparent;
    }
    .app { max-width: 900px; margin: 0 auto; padding: 12px 12px 80px; }

    /* Header */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
    }
    .header h1 { font-size: 1.25rem; font-weight: 700; }
    .header .sub { font-size: 0.75rem; color: var(--muted); }

    /* Tabs */
    .tabs {
      display: flex; gap: 4px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 4px; margin-bottom: 12px;
      position: sticky; top: 0; z-index: 10;
    }
    .tab-btn {
      flex: 1; padding: 10px 4px; font-size: 0.8rem; font-weight: 600;
      border: none; border-radius: 8px; background: transparent;
      color: var(--muted); cursor: pointer; text-align: center;
      transition: all 0.15s; white-space: nowrap;
    }
    .tab-btn.active { background: var(--accent); color: #fff; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* Summary bar */
    .summary {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
      margin-bottom: 12px;
    }
    .summary-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 12px 8px; text-align: center;
    }
    .summary-card .num { font-size: 1.5rem; font-weight: 700; }
    .summary-card .lbl { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
    .summary-card.low .num { color: var(--amber); }
    .summary-card.out .num { color: var(--red); }

    /* Filters */
    .filters {
      display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap;
    }
    .filter-btn {
      padding: 8px 14px; font-size: 0.8rem; font-weight: 600;
      border: 1px solid var(--border); border-radius: 20px;
      background: var(--card); color: var(--muted); cursor: pointer;
    }
    .filter-btn.active { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }
    .search-wrap { position: relative; margin-bottom: 10px; }
    .search-wrap input {
      width: 100%; padding: 12px 12px 12px 36px; font-size: 1rem;
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--card);
    }
    .search-wrap::before {
      content: "🔍"; position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      font-size: 0.9rem; opacity: 0.5;
    }

    /* Item cards */
    .item-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 12px; margin-bottom: 8px;
    }
    .item-header {
      display: flex; align-items: flex-start; justify-content: space-between;
      margin-bottom: 8px;
    }
    .item-name { font-weight: 600; font-size: 0.95rem; line-height: 1.3; flex: 1; }
    .item-actions { display: flex; gap: 6px; }
    .dist-badge {
      display: inline-block; padding: 2px 8px; border-radius: 10px;
      font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
    }
    .dist-vistar { background: #dbeafe; color: #1d4ed8; }
    .dist-costco { background: #dcfce7; color: #15803d; }
    .dist-amazon { background: #ffedd5; color: #c2410c; }
    .dist-faire  { background: #f3e8ff; color: #7e22ce; }
    .dist-other  { background: #f1f5f9; color: #475569; }
    .item-meta {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      font-size: 0.8rem; color: var(--muted); margin-bottom: 8px;
    }
    .qty-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px;
    }
    .qty-pill {
      display: flex; align-items: center; gap: 6px;
    }
    .qty-num { font-size: 1.1rem; font-weight: 700; }
    .qty-num.ok { color: var(--green); }
    .qty-num.low { color: var(--amber); }
    .qty-num.out { color: var(--red); }
    .surplus {
      font-size: 0.75rem; padding: 2px 8px; border-radius: 10px; font-weight: 600;
    }
    .surplus.ok { background: var(--green-light); color: #15803d; }
    .surplus.low { background: var(--amber-light); color: #92400e; }
    .surplus.out { background: var(--red-light); color: #b91c1c; }

    /* Inline edit */
    .edit-row {
      display: flex; align-items: center; gap: 8px; margin-top: 10px;
      padding-top: 10px; border-top: 1px solid var(--border);
    }
    .edit-row button {
      width: 40px; height: 40px; font-size: 1.2rem; font-weight: 700;
      border: 1px solid var(--border); border-radius: 10px;
      background: var(--card); cursor: pointer; display: flex;
      align-items: center; justify-content: center;
    }
    .edit-row input[type="number"] {
      width: 70px; text-align: center; font-size: 1.1rem; font-weight: 700;
      border: 1px solid var(--border); border-radius: 10px; padding: 8px;
    }
    .edit-row .save-btn {
      width: auto; padding: 0 16px; font-size: 0.85rem;
      background: var(--accent); color: #fff; border: none;
    }
    .edit-row .cancel-btn {
      width: auto; padding: 0 12px; font-size: 0.8rem;
      color: var(--muted);
    }
    .pick-btn {
      padding: 8px 12px; font-size: 0.75rem; font-weight: 600;
      border: 1px solid var(--accent); border-radius: 8px;
      background: var(--accent-light); color: var(--accent); cursor: pointer;
    }

    /* Forms */
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 4px; color: var(--muted); }
    .form-group input, .form-group select {
      width: 100%; padding: 12px; font-size: 1rem;
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--card);
    }
    .btn-primary {
      width: 100%; padding: 14px; font-size: 1rem; font-weight: 700;
      border: none; border-radius: var(--radius); background: var(--accent); color: #fff;
      cursor: pointer; margin-top: 4px;
    }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Log entries */
    .log-entry {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 10px 12px; margin-bottom: 6px;
      font-size: 0.85rem;
    }
    .log-entry .time { font-size: 0.7rem; color: var(--muted); }

    /* Pick lists */
    .pl-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 12px; margin-bottom: 8px;
    }
    .pl-header {
      display: flex; justify-content: space-between; align-items: center;
    }
    .pl-title { font-weight: 600; font-size: 0.9rem; }
    .pl-meta { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
    .pl-status {
      font-size: 0.65rem; font-weight: 700; text-transform: uppercase;
      padding: 3px 8px; border-radius: 10px;
    }
    .pl-status.draft { background: var(--amber-light); color: #92400e; }
    .pl-status.finalized { background: var(--green-light); color: #15803d; }
    .pl-items { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
    .pl-item { display: flex; justify-content: space-between; font-size: 0.85rem; padding: 3px 0; }
    .pl-actions { display: flex; gap: 6px; margin-top: 10px; }
    .pl-actions button {
      flex: 1; padding: 10px; font-size: 0.8rem; font-weight: 600;
      border: 1px solid var(--border); border-radius: 8px; background: var(--card); cursor: pointer;
    }
    .pl-actions .finalize-btn { background: var(--green); color: #fff; border-color: var(--green); }
    .pl-actions .delete-btn { color: var(--red); border-color: var(--red-light); background: var(--red-light); }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.4);
      display: none; align-items: flex-end; justify-content: center;
      z-index: 100;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: var(--card); border-radius: var(--radius) var(--radius) 0 0;
      width: 100%; max-width: 600px; max-height: 85vh; overflow-y: auto;
      padding: 20px 16px 30px;
    }
    .modal h3 { margin-bottom: 12px; font-size: 1.1rem; }
    .modal-close {
      position: absolute; top: 12px; right: 16px; font-size: 1.5rem;
      background: none; border: none; color: var(--muted); cursor: pointer;
    }

    /* Item selector in modal */
    .item-sel-row {
      display: flex; gap: 8px; align-items: center; margin-bottom: 8px;
    }
    .item-sel-row select { flex: 1; }
    .item-sel-row input { width: 70px; text-align: center; }
    .item-sel-row .remove-btn {
      width: 36px; height: 36px; font-size: 1rem; color: var(--red);
      border: 1px solid var(--red-light); background: var(--red-light);
      border-radius: 8px; cursor: pointer;
    }
    .add-row-btn {
      width: 100%; padding: 10px; font-size: 0.85rem; font-weight: 600;
      border: 1px dashed var(--border); border-radius: var(--radius);
      background: transparent; color: var(--accent); cursor: pointer; margin-bottom: 12px;
    }

    /* Empty state */
    .empty { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 0.9rem; }

    /* Auth screen */
    .auth-screen {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .auth-box {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 32px 24px; width: 100%; max-width: 360px;
      text-align: center;
    }
    .auth-box h2 { margin-bottom: 8px; }
    .auth-box p { color: var(--muted); font-size: 0.85rem; margin-bottom: 20px; }
    .auth-box input {
      width: 100%; padding: 14px; font-size: 1rem;
      border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 12px;
    }
    .auth-box .error { color: var(--red); font-size: 0.8rem; margin-bottom: 10px; }

    /* Toast */
    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px);
      background: var(--text); color: #fff; padding: 12px 20px; border-radius: 10px;
      font-size: 0.9rem; font-weight: 600; z-index: 200; opacity: 0;
      transition: all 0.3s; pointer-events: none; white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  </style>
</head>
<body>

<!-- Auth Screen -->
<div id="authScreen" class="auth-screen" style="display:none;">
  <div class="auth-box">
    <h2>🔐 Office Inventory</h2>
    <p>Kande VendTech warehouse tracker</p>
    <input type="password" id="authInput" placeholder="Enter password" onkeydown="if(event.key==='Enter')doLogin()">
    <div id="authError" class="error" style="display:none;">Incorrect password</div>
    <button class="btn-primary" onclick="doLogin()">Unlock</button>
  </div>
</div>

<!-- Main App -->
<div id="mainApp" class="app" style="display:none;">
  <div class="header">
    <div>
      <h1>📦 Office Inventory</h1>
      <div class="sub">Kande VendTech Warehouse</div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="inventory" onclick="switchTab('inventory')">Inventory</button>
    <button class="tab-btn" data-tab="addstock" onclick="switchTab('addstock')">Add Stock</button>
    <button class="tab-btn" data-tab="picklists" onclick="switchTab('picklists')">Pick Lists</button>
  </div>

  <!-- Tab: Inventory -->
  <div id="tab-inventory" class="tab-panel active">
    <div class="summary">
      <div class="summary-card"><div class="num" id="sTotal">0</div><div class="lbl">Items</div></div>
      <div class="summary-card low"><div class="num" id="sLow">0</div><div class="lbl">Low Stock</div></div>
      <div class="summary-card out"><div class="num" id="sOut">0</div><div class="lbl">Out of Stock</div></div>
    </div>
    <div class="filters">
      <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">All</button>
      <button class="filter-btn" data-filter="low" onclick="setFilter('low')">Low Stock</button>
      <button class="filter-btn" data-filter="out" onclick="setFilter('out')">Out of Stock</button>
    </div>
    <div class="search-wrap">
      <input type="text" id="invSearch" placeholder="Search items..." oninput="renderInventory()">
    </div>
    <div id="inventoryList"></div>
  </div>

  <!-- Tab: Add Stock -->
  <div id="tab-addstock" class="tab-panel">
    <div class="form-group">
      <label>Item</label>
      <select id="asItem"></select>
    </div>
    <div class="form-group">
      <label>Quantity Received</label>
      <input type="number" id="asQty" min="1" value="1">
    </div>
    <div class="form-group">
      <label>Source</label>
      <select id="asSource">
        <option>Vistar</option><option>Costco</option><option>Amazon</option><option>Faire</option><option>Other</option>
      </select>
    </div>
    <button class="btn-primary" onclick="addStock()">Add to Inventory</button>
    <h3 style="margin: 24px 0 10px; font-size: 0.9rem;">Recent Additions</h3>
    <div id="addStockLog"></div>
  </div>

  <!-- Tab: Pick Lists -->
  <div id="tab-picklists" class="tab-panel">
    <button class="btn-primary" onclick="openNewPickList()" style="margin-bottom:12px;">+ New Pick List</button>
    <div id="pickListsContainer"></div>
  </div>
</div>

<!-- Modal: New Pick List -->
<div id="plModal" class="modal-overlay" onclick="if(event.target===this)closePlModal()">
  <div class="modal" style="position:relative;">
    <button class="modal-close" onclick="closePlModal()">&times;</button>
    <h3>New Pick List</h3>
    <div class="form-group">
      <label>Label</label>
      <input type="text" id="plLabel" placeholder="e.g. Route A — Aug 23">
    </div>
    <div id="plItemRows"></div>
    <button class="add-row-btn" onclick="addPlRow()">+ Add Item</button>
    <button class="btn-primary" onclick="createPickList()">Create Pick List</button>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
  const API_BASE = '';
  let inventory = [];
  let pickLists = [];
  let filterMode = 'all';
  let editingId = null;
  let addStockHistory = [];

  // ---- Auth ----
  function checkAuth() {
    const pwd = localStorage.getItem('kv_auth');
    if (pwd === 'kande2026') { showApp(); return; }
    document.getElementById('authScreen').style.display = 'flex';
    document.getElementById('mainApp').style.display = 'none';
  }
  async function doLogin() {
    const pwd = document.getElementById('authInput').value;
    document.getElementById('authError').style.display = 'none';
    try {
      const r = await fetch(`${API_BASE}/api/auth/login`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pwd })
      });
      if (r.ok) {
        localStorage.setItem('kv_auth', pwd);
        showApp();
      } else {
        document.getElementById('authError').style.display = 'block';
      }
    } catch (e) {
      // offline fallback
      if (pwd === 'kande2026') {
        localStorage.setItem('kv_auth', pwd);
        showApp();
      } else {
        document.getElementById('authError').style.display = 'block';
      }
    }
  }
  function showApp() {
    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('mainApp').style.display = 'block';
    loadData();
  }

  // ---- Data ----
  async function api(method, path, body) {
    const opts = { method, headers: {} };
    const pwd = localStorage.getItem('kv_auth');
    if (pwd) opts.headers['x-api-key'] = pwd;
    if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
    const r = await fetch(`${API_BASE}${path}`, opts);
    if (!r.ok) throw new Error(`${r.status}: ${await r.text()}`);
    return r.json();
  }
  async function loadData() {
    try {
      inventory = await api('GET', '/api/office-inventory');
      pickLists = await api('GET', '/api/pick-lists');
      renderInventory();
      renderAddStock();
      renderPickLists();
    } catch (e) { toast('Error loading data'); console.error(e); }
  }

  // ---- Tabs ----
  function switchTab(name) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'tab-' + name));
    if (name === 'inventory') renderInventory();
    if (name === 'picklists') renderPickLists();
  }

  // ---- Inventory ----
  function setFilter(m) {
    filterMode = m;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.filter === m));
    renderInventory();
  }
  function getSurplus(item) { return item.quantity - item.min_qty; }
  function distClass(d) {
    const m = (d || '').toLowerCase();
    if (m.includes('vistar')) return 'dist-vistar';
    if (m.includes('costco')) return 'dist-costco';
    if (m.includes('amazon')) return 'dist-amazon';
    if (m.includes('faire')) return 'dist-faire';
    return 'dist-other';
  }
  function renderInventory() {
    const q = document.getElementById('invSearch').value.toLowerCase();
    const filtered = inventory.filter(it => {
      const surplus = getSurplus(it);
      if (filterMode === 'low' && surplus >= 0) return false;
      if (filterMode === 'out' && it.quantity !== 0) return false;
      if (q && !it.name.toLowerCase().includes(q)) return false;
      return true;
    });

    const total = inventory.length;
    const low = inventory.filter(it => getSurplus(it) < 0 && it.quantity > 0).length;
    const out = inventory.filter(it => it.quantity === 0).length;
    document.getElementById('sTotal').textContent = total;
    document.getElementById('sLow').textContent = low;
    document.getElementById('sOut').textContent = out;

    const el = document.getElementById('inventoryList');
    if (!filtered.length) { el.innerHTML = '<div class="empty">No items match</div>'; return; }

    el.innerHTML = filtered.map(it => {
      const surplus = getSurplus(it);
      const qtyClass = it.quantity === 0 ? 'out' : (surplus < 0 ? 'low' : 'ok');
      const surClass = it.quantity === 0 ? 'out' : (surplus < 0 ? 'low' : 'ok');
      const surText = surplus >= 0 ? `+${surplus}` : `${surplus}`;
      const isEditing = editingId === it.id;
      const editHtml = isEditing ? `
        <div class="edit-row">
          <button onclick="adjQty('${it.id}', -1)">-</button>
          <input type="number" id="eq-${it.id}" value="${it.quantity}" min="0">
          <button onclick="adjQty('${it.id}', 1)">+</button>
          <button class="save-btn" onclick="saveQty('${it.id}')">Save</button>
          <button class="cancel-btn" onclick="cancelEdit()">Cancel</button>
        </div>
      ` : '';
      return `
        <div class="item-card">
          <div class="item-header">
            <div class="item-name">${esc(it.name)}</div>
            <div class="item-actions">
              <button class="pick-btn" onclick="quickPick('${it.id}')">+ Pick</button>
            </div>
          </div>
          <div class="item-meta">
            <span class="dist-badge ${distClass(it.distributor)}">${esc(it.distributor || 'Other')}</span>
            <span>${esc(it.size || '')}</span>
            ${it.link ? `<a href="${esc(it.link)}" target="_blank" style="color:var(--accent);font-size:0.75rem;">Order ↗</a>` : ''}
          </div>
          <div class="qty-row" onclick="if(!editingId)startEdit('${it.id}')">
            <div class="qty-pill">
              <span class="qty-num ${qtyClass}">${it.quantity}</span>
              <span style="font-size:0.75rem;color:var(--muted);">/ ${it.min_qty} min</span>
            </div>
            <span class="surplus ${surClass}">${surText}</span>
          </div>
          ${editHtml}
        </div>
      `;
    }).join('');
  }
  function esc(s) { return (s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function startEdit(id) { editingId = id; renderInventory(); setTimeout(() => document.getElementById('eq-' + id)?.focus(), 50); }
  function cancelEdit() { editingId = null; renderInventory(); }
  function adjQty(id, delta) {
    const inp = document.getElementById('eq-' + id);
    if (inp) inp.value = Math.max(0, parseInt(inp.value || 0) + delta);
  }
  async function saveQty(id) {
    const val = parseInt(document.getElementById('eq-' + id).value || 0);
    const item = inventory.find(i => i.id === id);
    if (!item) return;
    const delta = val - item.quantity;
    try {
      await api('POST', '/api/office-inventory/adjust', { id, delta, reason: 'Manual adjustment' });
      item.quantity = val;
      if (!item.history) item.history = [];
      item.history.push({ delta, old_qty: val - delta, new_qty: val, reason: 'Manual adjustment', created_at: new Date().toISOString() });
      editingId = null;
      renderInventory();
      toast('Saved');
    } catch (e) { toast('Save failed'); }
  }
  function quickPick(id) {
    openNewPickList();
    setTimeout(() => {
      const rows = document.getElementById('plItemRows');
      if (rows.children.length === 1) {
        const sel = rows.children[0].querySelector('select');
        const qty = rows.children[0].querySelector('input[type="number"]');
        sel.value = id;
        qty.value = 1;
        qty.focus();
      }
    }, 50);
  }

  // ---- Add Stock ----
  function renderAddStock() {
    const sel = document.getElementById('asItem');
    sel.innerHTML = '<option value="">Select item...</option>' +
      inventory.map(it => `<option value="${esc(it.id)}">${esc(it.name)}</option>`).join('');
    renderAddStockLog();
  }
  async function addStock() {
    const id = document.getElementById('asItem').value;
    const qty = parseInt(document.getElementById('asQty').value || 0);
    const source = document.getElementById('asSource').value;
    if (!id || qty <= 0) { toast('Select item and quantity'); return; }
    try {
      await api('POST', '/api/office-inventory/adjust', { id, delta: qty, reason: `Received from ${source}` });
      const item = inventory.find(i => i.id === id);
      addStockHistory.unshift({ name: item.name, qty, source, time: new Date().toLocaleString() });
      item.quantity += qty;
      renderInventory();
      renderAddStockLog();
      document.getElementById('asQty').value = 1;
      toast(`Added ${qty} ${item.name}`);
    } catch (e) { toast('Failed to add stock'); }
  }
  function renderAddStockLog() {
    const el = document.getElementById('addStockLog');
    if (!addStockHistory.length) { el.innerHTML = '<div class="empty">No recent additions</div>'; return; }
    el.innerHTML = addStockHistory.slice(0, 20).map(l => `
      <div class="log-entry">
        <div><strong>+${l.qty}</strong> ${esc(l.name)} <span style="color:var(--muted)">from ${esc(l.source)}</span></div>
        <div class="time">${esc(l.time)}</div>
      </div>
    `).join('');
  }

  // ---- Pick Lists ----
  function renderPickLists() {
    const el = document.getElementById('pickListsContainer');
    const lists = [...pickLists].sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
    if (!lists.length) { el.innerHTML = '<div class="empty">No pick lists yet</div>'; return; }
    el.innerHTML = lists.map(pl => {
      const isExpanded = pl._expanded;
      return `
        <div class="pl-card">
          <div class="pl-header" onclick="togglePl('${pl.id}')">
            <div>
              <div class="pl-title">${esc(pl.label)}</div>
              <div class="pl-meta">${new Date(pl.created_at).toLocaleDateString()} · ${pl.items.length} items · ${pl.status}</div>
            </div>
            <span class="pl-status ${pl.status}">${pl.status}</span>
          </div>
          ${isExpanded ? `
            <div class="pl-items">
              ${pl.items.map(it => {
                const inv = inventory.find(i => i.id === it.id);
                return `<div class="pl-item"><span>${esc(it.name || (inv?.name) || it.id)}</span><span>x${it.qty}</span></div>`;
              }).join('')}
            </div>
            ${pl.status === 'draft' ? `
              <div class="pl-actions">
                <button class="finalize-btn" onclick="finalizePl('${pl.id}')">✓ Finalize</button>
                <button class="delete-btn" onclick="deletePl('${pl.id}')">Delete</button>
              </div>
            ` : ''}
          ` : ''}
        </div>
      `;
    }).join('');
  }
  function togglePl(id) {
    const pl = pickLists.find(l => l.id === id);
    if (pl) { pl._expanded = !pl._expanded; renderPickLists(); }
  }
  function openNewPickList() {
    document.getElementById('plLabel').value = '';
    document.getElementById('plItemRows').innerHTML = '';
    addPlRow();
    document.getElementById('plModal').classList.add('active');
  }
  function closePlModal() { document.getElementById('plModal').classList.remove('active'); }
  function addPlRow() {
    const rows = document.getElementById('plItemRows');
    const div = document.createElement('div');
    div.className = 'item-sel-row';
    div.innerHTML = `
      <select>${inventory.map(it => `<option value="${esc(it.id)}">${esc(it.name)}</option>`).join('')}</select>
      <input type="number" min="1" value="1">
      <button class="remove-btn" onclick="this.parentElement.remove()">&times;</button>
    `;
    rows.appendChild(div);
  }
  async function createPickList() {
    const label = document.getElementById('plLabel').value.trim();
    if (!label) { toast('Enter a label'); return; }
    const rows = document.querySelectorAll('#plItemRows .item-sel-row');
    const items = [];
    rows.forEach(r => {
      const sel = r.querySelector('select');
      const qty = parseInt(r.querySelector('input').value || 0);
      if (sel.value && qty > 0) {
        const inv = inventory.find(i => i.id === sel.value);
        items.push({ id: sel.value, name: inv?.name || sel.value, qty });
      }
    });
    if (!items.length) { toast('Add at least one item'); return; }
    try {
      const pl = await api('POST', '/api/pick-lists', { label, items });
      pickLists.push(pl);
      closePlModal();
      renderPickLists();
      toast('Pick list created');
    } catch (e) { toast('Failed to create pick list'); }
  }
  async function finalizePl(id) {
    if (!confirm('Deduct these quantities from inventory?')) return;
    try {
      const pl = await api('PUT', `/api/pick-lists/${id}/finalize`);
      const idx = pickLists.findIndex(l => l.id === id);
      if (idx >= 0) pickLists[idx] = { ...pickLists[idx], ...pl };
      await loadData();
      toast('Pick list finalized');
    } catch (e) {
      const msg = e.message || '';
      if (msg.includes('Insufficient')) toast('Insufficient stock');
      else toast('Finalize failed');
    }
  }
  async function deletePl(id) {
    if (!confirm('Delete this pick list?')) return;
    try {
      await api('DELETE', `/api/pick-lists/${id}`);
      pickLists = pickLists.filter(l => l.id !== id);
      renderPickLists();
      toast('Deleted');
    } catch (e) { toast('Delete failed'); }
  }

  // ---- Toast ----
  let toastT;
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastT);
    toastT = setTimeout(() => el.classList.remove('show'), 2200);
  }

  // Init
  checkAuth();
</script>
</body>
</html>
