<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kande VendTech — Office Inventory</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-vend-32.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #f8fafc; --card: #ffffff; --border: #e2e8f0; --text: #0f172a;
      --muted: #64748b; --accent: #3b82f6; --accent-light: #eff6ff;
      --green: #22c55e; --green-light: #f0fdf4;
      --amber: #f59e0b; --amber-light: #fffbeb;
      --red: #ef4444; --red-light: #fef2f2;
      --purple: #8b5cf6; --purple-light: #f5f3ff;
      --teal: #14b8a6; --teal-light: #f0fdfa;
      --radius: 12px;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
      --shadow: 0 4px 12px rgba(0,0,0,0.06);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.5;
      -webkit-tap-highlight-color: transparent;
    }
    .app { max-width: 900px; margin: 0 auto; padding: 12px 12px 80px; }

    /* Header */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
    }
    .header h1 { font-size: 1.25rem; font-weight: 700; }
    .header .sub { font-size: 0.75rem; color: var(--muted); }

    /* Tabs */
    .tabs {
      display: flex; gap: 4px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 4px; margin-bottom: 12px;
      position: sticky; top: 0; z-index: 10;
    }
    .tab-btn {
      flex: 1; padding: 10px 4px; font-size: 0.8rem; font-weight: 600;
      border: none; border-radius: 8px; background: transparent;
      color: var(--muted); cursor: pointer; text-align: center;
      transition: all 0.15s; white-space: nowrap;
    }
    .tab-btn.active { background: var(--accent); color: #fff; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* Summary bar */
    .summary {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
      margin-bottom: 12px;
    }
    .summary-card.active { box-shadow: 0 0 0 2px var(--accent); }
    .summary-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 12px 8px; text-align: center;
    }
    .summary-card .num { font-size: 1.5rem; font-weight: 700; }
    .summary-card .lbl { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
    .summary-card.low .num { color: var(--amber); }
    .summary-card.out .num { color: var(--red); }

    /* Filters */
    .filters {
      display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap;
    }
    .filter-btn {
      padding: 8px 14px; font-size: 0.8rem; font-weight: 600;
      border: 1px solid var(--border); border-radius: 20px;
      background: var(--card); color: var(--muted); cursor: pointer;
    }
    .filter-btn.active { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }
    .search-wrap { position: relative; margin-bottom: 10px; }
    .search-wrap input {
      width: 100%; padding: 12px 12px 12px 36px; font-size: 1rem;
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--card);
    }
    .search-wrap::before {
      content: "🔍"; position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      font-size: 0.9rem; opacity: 0.5;
    }

    /* Item cards */
    .inv-grid {
      display: grid;
      grid-template-columns: 1fr 48px 72px 64px;
      align-items: center;
      gap: 0 6px;
      padding: 0 10px;
    }
    .item-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 8px; padding: 5px 0; margin-bottom: 4px;
      flex-wrap: wrap;
    }
    .item-header { display: none; }
    .item-name { font-weight: 600; font-size: 0.82rem; flex: 1; min-width: 0; white-space: normal; line-height: 1.2; }
    .item-actions { display: flex; gap: 6px; }
    .dist-badge {
      display: inline-block; padding: 2px 8px; border-radius: 10px;
      font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
    }
    .dist-vistar { background: #dbeafe; color: #1d4ed8; }
    .dist-costco { background: #dcfce7; color: #15803d; }
    .dist-amazon { background: #ffedd5; color: #c2410c; }
    .dist-faire  { background: #f3e8ff; color: #7e22ce; }
    .dist-other  { background: #f1f5f9; color: #475569; }
    .item-meta { display: none; }
    .qty-row {
      display: flex; align-items: center; gap: 6px; white-space: nowrap;
    }
    .qty-pill {
      display: flex; align-items: center; gap: 4px;
    }
    .qty-num { font-size: 0.88rem; font-weight: 700; }
    .qty-num.ok { color: var(--green); }
    .qty-num.low { color: var(--amber); }
    .qty-num.out { color: var(--red); }
    .surplus {
      font-size: 0.72rem; padding: 1px 6px; border-radius: 8px; font-weight: 600;
    }
    .surplus.ok { background: var(--green-light); color: #15803d; }
    .surplus.low { background: var(--amber-light); color: #92400e; }
    .surplus.out { background: var(--red-light); color: #b91c1c; }

    /* Inline edit */
    .edit-row {
      display: flex; align-items: center; gap: 6px;
      width: 100%; padding-top: 6px; margin-top: 4px;
      border-top: 1px solid var(--border); flex-basis: 100%;
    }
    .edit-row button {
      width: 34px; height: 34px; font-size: 1.1rem; font-weight: 700;
      border: 1px solid var(--border); border-radius: 8px;
      background: var(--card); cursor: pointer; display: flex;
      align-items: center; justify-content: center; flex-shrink: 0;
    }
    .edit-row input[type="number"] {
      width: 60px; text-align: center; font-size: 1rem; font-weight: 700;
      border: 1px solid var(--border); border-radius: 8px; padding: 6px 4px;
      flex-shrink: 0;
    }
    .edit-row .save-btn {
      flex: 1; height: 34px; font-size: 0.82rem;
      background: var(--accent); color: #fff; border: none; border-radius: 8px;
    }
    .edit-row .cancel-btn {
      width: auto; padding: 0 10px; height: 34px; font-size: 0.8rem;
      color: var(--muted); flex-shrink: 0;
    }
    .pick-btn {
      padding: 8px 12px; font-size: 0.75rem; font-weight: 600;
      border: 1px solid var(--accent); border-radius: 8px;
      background: var(--accent-light); color: var(--accent); cursor: pointer;
    }

    /* Forms */
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 4px; color: var(--muted); }
    .form-group input, .form-group select {
      width: 100%; padding: 12px; font-size: 1rem;
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--card);
    }
    .btn-primary {
      width: 100%; padding: 14px; font-size: 1rem; font-weight: 700;
      border: none; border-radius: var(--radius); background: var(--accent); color: #fff;
      cursor: pointer; margin-top: 4px;
    }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Log entries */
    .log-entry {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 10px 12px; margin-bottom: 6px;
      font-size: 0.85rem;
    }
    .log-entry .time { font-size: 0.7rem; color: var(--muted); }

    /* Pick lists */
    .pl-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 12px; margin-bottom: 8px;
    }
    .pl-header {
      display: flex; justify-content: space-between; align-items: center;
    }
    .pl-title { font-weight: 600; font-size: 0.9rem; }
    .pl-meta { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
    .pl-status {
      font-size: 0.65rem; font-weight: 700; text-transform: uppercase;
      padding: 3px 8px; border-radius: 10px;
    }
    .pl-status.draft { background: var(--amber-light); color: #92400e; }
    .pl-status.finalized { background: var(--green-light); color: #15803d; }
    .pl-status.rolled_back { background: var(--red-light); color: #b91c1c; }
    .pl-items { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
    .pl-item {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 0.85rem; padding: 6px 0; gap: 8px;
    }
    .pl-item .chk {
      width: 22px; height: 22px; accent-color: var(--accent); flex-shrink: 0;
    }
    .pl-item .name { flex: 1; }
    .pl-item .need { font-weight: 600; }
    .pl-item .need.warn { color: var(--red); }
    .pl-item .packed-at { font-size: 0.7rem; color: var(--green); }
    .pl-actions { display: flex; gap: 6px; margin-top: 10px; }
    .pl-actions button {
      flex: 1; padding: 10px; font-size: 0.8rem; font-weight: 600;
      border: 1px solid var(--border); border-radius: 8px; background: var(--card); cursor: pointer;
    }
    .pl-actions .done-btn {
      background: var(--green); color: #fff; border-color: var(--green);
      padding: 14px; font-size: 1rem;
    }
    .pl-actions .done-btn:disabled {
      background: #dcfce7; color: #86efac; border-color: #dcfce7;
    }
    .pl-actions .rollback-btn { color: var(--red); border-color: var(--red-light); background: var(--red-light); }
    .pl-actions .delete-btn { color: var(--muted); }
    .completed-badge {
      background: var(--green); color: #fff; padding: 14px; border-radius: var(--radius);
      text-align: center; font-weight: 700; font-size: 1rem; margin-top: 10px;
    }

    /* Machine selector */
    .machine-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 12px; margin-bottom: 8px;
      display: flex; align-items: center; gap: 10px; cursor: pointer;
    }
    .machine-card.selected { border-color: var(--accent); background: var(--accent-light); }
    .machine-card input { width: 22px; height: 22px; accent-color: var(--accent); flex-shrink: 0; }
    .machine-name { font-weight: 600; font-size: 0.95rem; flex: 1; }
    .machine-meta { font-size: 0.75rem; color: var(--muted); }
    .missing-banner {
      background: var(--red-light); color: #b91c1c; border: 1px solid #fecaca;
      border-radius: var(--radius); padding: 10px 12px; margin-bottom: 10px;
      font-size: 0.85rem;
    }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.4);
      display: none; align-items: flex-end; justify-content: center;
      z-index: 100;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: var(--card); border-radius: var(--radius) var(--radius) 0 0;
      width: 100%; max-width: 600px; max-height: 85vh; overflow-y: auto;
      padding: 20px 16px 30px;
    }
    .modal h3 { margin-bottom: 12px; font-size: 1.1rem; }
    .modal-close {
      position: absolute; top: 12px; right: 16px; font-size: 1.5rem;
      background: none; border: none; color: var(--muted); cursor: pointer;
    }

    /* Empty state */
    .empty { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 0.9rem; }

    /* Auth screen */
    .auth-screen {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .auth-box {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 32px 24px; width: 100%; max-width: 360px;
      text-align: center;
    }
    .auth-box h2 { margin-bottom: 8px; }
    .auth-box p { color: var(--muted); font-size: 0.85rem; margin-bottom: 20px; }
    .auth-box input {
      width: 100%; padding: 14px; font-size: 1rem;
      border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 12px;
    }
    .auth-box .error { color: var(--red); font-size: 0.8rem; margin-bottom: 10px; }

    /* Toast */
    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px);
      background: var(--text); color: #fff; padding: 12px 20px; border-radius: 10px;
      font-size: 0.9rem; font-weight: 600; z-index: 200; opacity: 0;
      transition: all 0.3s; pointer-events: none; white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  </style>
</head>
<body>

<!-- Main App -->
<div id="mainApp" class="app">
  <div class="header">
    <div>
      <h1>📦 Office Inventory</h1>
      <div class="sub">Kande VendTech Warehouse</div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="inventory" onclick="switchTab('inventory')">Inventory</button>
    <button class="tab-btn" data-tab="addstock" onclick="switchTab('addstock')">Add Stock</button>
    <button class="tab-btn" data-tab="picklists" onclick="switchTab('picklists')">Pick Lists</button>
  </div>

  <!-- Tab: Inventory -->
  <div id="tab-inventory" class="tab-panel active">
    <!-- Not in spreadsheet section -->
    <div id="unmatchedSection" style="display:none;margin-bottom:12px;background:var(--amber-light);border:1px solid var(--amber);border-radius:10px;padding:10px;">
      <div style="font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:#92400e;margin-bottom:6px;">⚠️ In machines but not in your spreadsheet</div>
      <div id="unmatchedList" style="font-size:0.82rem;"></div>
    </div>
    <div class="summary">
      <div class="summary-card active" id="sc-all" onclick="setFilter('all')" style="cursor:pointer;"><div class="num" id="sTotal">0</div><div class="lbl">Items</div></div>
      <div class="summary-card low" id="sc-low" onclick="setFilter('low')" style="cursor:pointer;"><div class="num" id="sLow">0</div><div class="lbl">Low Stock</div></div>
      <div class="summary-card out" id="sc-out" onclick="setFilter('out')" style="cursor:pointer;"><div class="num" id="sOut">0</div><div class="lbl">Out of Stock</div></div>
    </div>
    <div class="search-wrap">
      <input type="text" id="invSearch" placeholder="Search items..." oninput="renderInventory()">
    </div>
    <div class="inv-grid" style="padding-top:2px;padding-bottom:4px;font-size:0.65rem;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:var(--muted);">
      <span>Item</span>
      <span style="text-align:center;">Dist</span>
      <span style="text-align:right;">Qty</span>
      <span style="text-align:right;">Surplus</span>
    </div>
    <div id="inventoryList"></div>
  </div>

  <!-- Tab: Add Stock -->
  <div id="tab-addstock" class="tab-panel">
    <div class="form-group">
      <label>Item</label>
      <select id="asItem"></select>
    </div>
    <div class="form-group">
      <label>Quantity Received</label>
      <input type="number" id="asQty" min="1" value="1">
    </div>
    <div class="form-group">
      <label>Source</label>
      <select id="asSource">
        <option>Vistar</option><option>Costco</option><option>Amazon</option><option>Faire</option><option>Other</option>
      </select>
    </div>
    <button class="btn-primary" onclick="addStock()">Add to Inventory</button>
    <h3 style="margin: 24px 0 10px; font-size: 0.9rem;">Recent Additions</h3>
    <div id="addStockLog"></div>
  </div>

  <!-- Tab: Pick Lists -->
  <div id="tab-picklists" class="tab-panel">
    <div id="pickListView">
      <button class="btn-primary" onclick="refreshAllPickLists()" id="refreshBtn" style="margin-bottom:12px;width:100%;">&#8635; Refresh Stock</button>
      <div id="pickListsContainer"></div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<!-- Lightbox -->
<div id="lightbox" onclick="closeLightbox()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:300;align-items:center;justify-content:center;padding:24px;">
  <img id="lightboxImg" src="" style="max-width:100%;max-height:90vh;border-radius:10px;object-fit:contain;">
</div>

<!-- Add/Replace Item Modal -->
<div id="replaceModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;align-items:center;justify-content:center;padding:16px;">
  <div style="background:var(--card);border-radius:16px;padding:20px;width:100%;max-width:420px;">
    <div style="font-weight:700;font-size:1rem;margin-bottom:14px;">Add / Replace Item</div>
    <label style="font-size:0.75rem;font-weight:600;color:var(--muted);display:block;margin-bottom:4px;">New Item (from inventory)</label>
    <select id="newItemSelect" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:0.85rem;margin-bottom:12px;"></select>
    <label style="font-size:0.75rem;font-weight:600;color:var(--muted);display:block;margin-bottom:4px;">Replace Which Item?</label>
    <select id="replaceTarget" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:0.85rem;margin-bottom:12px;"></select>
    <label style="font-size:0.75rem;font-weight:600;color:var(--muted);display:block;margin-bottom:4px;">Starting Quantity</label>
    <input id="newItemQty" type="number" min="0" value="0" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:0.9rem;margin-bottom:12px;">
    <label style="font-size:0.75rem;font-weight:600;color:var(--muted);display:block;margin-bottom:4px;">Note (optional)</label>
    <textarea id="replaceNote" placeholder="e.g. customer requested, seasonal swap..." rows="2" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:0.85rem;resize:none;margin-bottom:16px;"></textarea>
    <div style="display:flex;gap:8px;">
      <button onclick="closeReplaceModal()" style="flex:1;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--card);font-size:0.9rem;cursor:pointer;">Cancel</button>
      <button onclick="submitReplace()" style="flex:2;padding:10px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-weight:700;font-size:0.9rem;cursor:pointer;">Save</button>
    </div>
  </div>
</div>

<script>
  const API_BASE = '';
  let inventory = [];
  let pickLists = [];
  let machines = [];
  let stockData = [];
  let capacityOverrides = {};
  let selectedMachines = new Set();
  let filterMode = 'all';
  let editingId = null;
  let addStockHistory = [];
  const SANDSTAR_CDN = 'https://image-us.sandstar.com/images/';
  function getPicUrl(pic) {
    if (!pic) return '';
    return pic.startsWith('http') ? pic : SANDSTAR_CDN + pic;
  }
  const STOCK_ALIASES = {
    'hershey pretzel dipped cc': 'hershey dipped cc',
    'snickers king size': 'snickers share size',
    'monster energy black': 'monster energy zerosugar',
    'monster energy zero sugar': 'monster energy zerosugar',
    'reeses king size': 'reeses',
    'airheads xtreme': 'airheads xtremes',
    'celsius arctic vibe': 'celsius artic vibe 12 oz',
  };
  function normName(s) {
    return (s || '').toLowerCase()
      .replace(/\(.*?\)/g, '')        // drop parentheticals: "(Black)", "(Orange)"
      .replace(/[_\-]/g, ' ')         // underscores/hyphens -> space
      .replace(/[^a-z0-9 ]/g, '')     // strip all other punctuation (handles curly apostrophes, commas, etc.)
      .replace(/\s+/g, ' ').trim();
  }
  function getStockPic(name) {
    let normInv = normName(name);
    if (STOCK_ALIASES[normInv]) normInv = STOCK_ALIASES[normInv];
    const invWords = normInv.split(' ').filter(Boolean);
    let bestMatch = null, bestScore = 0;
    for (const s of stockData) {
      if (!s.picture) continue;
      const normStock = normName(s.product_name);
      // Exact match — done immediately
      if (normStock === normInv) return getPicUrl(s.picture);
      // Stock name starts with inv name (stock has a size suffix appended)
      if (normStock.startsWith(normInv + ' ')) { bestMatch = s; bestScore = 1; continue; }
      // Word overlap: what fraction of inventory words appear in stock name
      const stockWordSet = new Set(normStock.split(' ').filter(Boolean));
      const overlap = invWords.filter(w => stockWordSet.has(w)).length;
      const score = invWords.length ? overlap / invWords.length : 0;
      if (score >= 0.8 && score > bestScore) { bestMatch = s; bestScore = score; }
    }
    return bestMatch ? getPicUrl(bestMatch.picture) : '';
  }
  function thumbHtml(picUrl, size) {
    const s = size || 32;
    if (!picUrl) return `<div style="width:${s}px;height:${s}px;flex-shrink:0;"></div>`;
    return `<img src="${esc(picUrl)}" onclick="openLightbox(event,'${esc(picUrl)}')" style="width:${s}px;height:${s}px;object-fit:cover;border-radius:5px;flex-shrink:0;cursor:zoom-in;" onerror="this.style.display='none'">`;
  }
  function openLightbox(e, url) {
    e.stopPropagation();
    const lb = document.getElementById('lightbox');
    document.getElementById('lightboxImg').src = url;
    lb.style.display = 'flex';
  }
  function closeLightbox() { document.getElementById('lightbox').style.display = 'none'; }

  function showApp() { loadData(); }

  // ---- Data ----
  async function api(method, path, body) {
    const opts = { method, headers: { 'x-api-key': 'kande2026' } };
    if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
    const r = await fetch(`${API_BASE}${path}`, opts);
    if (!r.ok) throw new Error(`${r.status}: ${await r.text()}`);
    return r.json();
  }
  async function loadData() {
    try {
      [inventory, pickLists, machines] = await Promise.all([
        api('GET', '/api/office-inventory'),
        api('GET', '/api/pick-lists'),
        api('GET', '/api/office-machines'),
      ]);
      const stockRes = await api('GET', '/api/office-stock').catch(() => ({ records: [] }));
      stockData = stockRes.records || [];
      renderInventory();
      renderAddStock();
      renderPickLists();
      loadUnmatched();
    } catch (e) { toast('Error loading data'); console.error(e); }
  }

  async function loadUnmatched() {
    try {
      const unmatched = await api('GET', '/api/office-unmatched');
      const sec = document.getElementById('unmatchedSection');
      const list = document.getElementById('unmatchedList');
      if (!unmatched.length) { sec.style.display = 'none'; return; }
      sec.style.display = 'block';
      list.innerHTML = unmatched.map(u =>
        `<div style="display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid rgba(0,0,0,0.06);">
          ${u.picture ? `<img src="${esc(getPicUrl(u.picture))}" onclick="openLightbox(event,'${esc(getPicUrl(u.picture))}')" style="width:28px;height:28px;object-fit:cover;border-radius:4px;flex-shrink:0;cursor:zoom-in;">` : ''}
          <span>${esc(u.product_name)}</span>
        </div>`
      ).join('');
    } catch(e) {}
  }

  function openReplaceModal() {
    const opts = inventory.map(i => `<option value="${esc(i.id)}">${esc(i.name)}</option>`).join('');
    document.getElementById('newItemSelect').innerHTML = opts;
    document.getElementById('replaceTarget').innerHTML = '<option value="">— None —</option>' + opts;
    document.getElementById('newItemQty').value = '0';
    document.getElementById('replaceNote').value = '';
    document.getElementById('replaceModal').style.display = 'flex';
  }
  function closeReplaceModal() { document.getElementById('replaceModal').style.display = 'none'; }
  async function submitReplace() {
    const newId = document.getElementById('newItemSelect').value;
    const targetId = document.getElementById('replaceTarget').value;
    const qty = parseInt(document.getElementById('newItemQty').value) || 0;
    const note = document.getElementById('replaceNote').value.trim();
    if (!newId) { toast('Select a new item'); return; }
    const newItem = inventory.find(i => i.id === newId);
    if (!newItem) { toast('Item not found'); return; }
    try {
      if (targetId) {
        const target = inventory.find(i => i.id === targetId);
        if (!target) { toast('Target item not found'); return; }
        await api('PUT', `/api/office-inventory/${targetId}`, { ...target, name: newItem.name, quantity: qty, note: note || undefined });
        toast(`✓ Replaced "${target.name}" with "${newItem.name}"`);
      } else {
        await api('PUT', `/api/office-inventory/${newId}`, { ...newItem, quantity: qty, note: note || undefined });
        toast(`✓ Updated "${newItem.name}"`);
      }
      closeReplaceModal();
      inventory = await api('GET', '/api/office-inventory');
      renderInventory();
      loadUnmatched();
    } catch(e) { toast('Save failed'); console.error(e); }
  }

  // ---- Tabs ----
  function switchTab(name) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'tab-' + name));
    if (name === 'inventory') renderInventory();
    if (name === 'picklists') { renderPickLists(); refreshAllPickLists(); } // always refresh qty on tab open
  }

  // ---- Inventory ----
  function setFilter(m) {
    filterMode = m;
    ['all','low','out'].forEach(k => document.getElementById('sc-'+k)?.classList.toggle('active', k === m));
    renderInventory();
  }
  function getSurplus(item) { return item.quantity - item.min_qty; }
  function distClass(d) {
    const m = (d || '').toLowerCase();
    if (m.includes('vistar')) return 'dist-vistar';
    if (m.includes('costco')) return 'dist-costco';
    if (m.includes('amazon')) return 'dist-amazon';
    if (m.includes('faire')) return 'dist-faire';
    return 'dist-other';
  }
  function renderInventory() {
    const q = document.getElementById('invSearch').value.toLowerCase();
    const filtered = inventory.filter(it => {
      const surplus = getSurplus(it);
      if (filterMode === 'low' && surplus >= 0) return false;
      if (filterMode === 'out' && it.quantity !== 0) return false;
      if (q && !it.name.toLowerCase().includes(q)) return false;
      return true;
    });

    const total = inventory.length;
    const low = inventory.filter(it => getSurplus(it) < 0 && it.quantity > 0).length;
    const out = inventory.filter(it => it.quantity === 0).length;
    document.getElementById('sTotal').textContent = total;
    document.getElementById('sLow').textContent = low;
    document.getElementById('sOut').textContent = out;

    const el = document.getElementById('inventoryList');
    if (!filtered.length) { el.innerHTML = '<div class="empty">No items match</div>'; return; }

    el.innerHTML = filtered.map(it => {
      const surplus = getSurplus(it);
      const qtyClass = it.quantity === 0 ? 'out' : (surplus < 0 ? 'low' : 'ok');
      const surClass = it.quantity === 0 ? 'out' : (surplus < 0 ? 'low' : 'ok');
      const surText = surplus >= 0 ? `+${surplus}` : `${surplus}`;
      const isEditing = editingId === it.id;
      const editHtml = isEditing ? `
        <div class="edit-row">
          <button onclick="adjQty('${it.id}', -1)">-</button>
          <input type="number" id="eq-${it.id}" value="${it.quantity}" min="0">
          <button onclick="adjQty('${it.id}', 1)">+</button>
          <button class="save-btn" onclick="saveQty('${it.id}')">Save</button>
          <button class="cancel-btn" onclick="cancelEdit()">Cancel</button>
        </div>
      ` : '';
      const pic = getStockPic(it.name);
      return `
        <div class="item-card" style="flex-wrap:wrap;">
          <div class="inv-grid" style="width:100%;cursor:pointer;" onclick="if(!editingId)startEdit('${it.id}')">
            <div class="item-name" style="display:flex;align-items:center;gap:6px;" title="${esc(it.name)}">${pic ? `<img src="${esc(pic)}" onclick="openLightbox(event,'${esc(pic)}')" style="width:28px;height:28px;object-fit:cover;border-radius:4px;flex-shrink:0;cursor:zoom-in;" onerror="this.style.display='none'">` : ''}<span>${esc(it.name)}</span></div>
            <span class="dist-badge ${distClass(it.distributor)}" style="text-align:center;font-size:0.6rem;padding:1px 2px;display:block;">${esc((it.distributor||'').slice(0,3).toUpperCase())}</span>
            <div style="text-align:right;">
              <span class="qty-num ${qtyClass}">${it.quantity}</span><span style="font-size:0.7rem;color:var(--muted);">/${it.min_qty}</span>
            </div>
            <div style="text-align:right;"><span class="surplus ${surClass}">${surText}</span></div>
          </div>
          ${editHtml}
        </div>
      `;
    }).join('');
  }
  function esc(s) { return (s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function startEdit(id) { editingId = id; renderInventory(); setTimeout(() => document.getElementById('eq-' + id)?.focus(), 50); }
  function cancelEdit() { editingId = null; renderInventory(); }
  function adjQty(id, delta) {
    const inp = document.getElementById('eq-' + id);
    if (inp) inp.value = Math.max(0, parseInt(inp.value || 0) + delta);
  }
  async function saveQty(id) {
    const val = parseInt(document.getElementById('eq-' + id).value || 0);
    const item = inventory.find(i => i.id === id);
    if (!item) return;
    const delta = val - item.quantity;
    try {
      await api('POST', '/api/office-inventory/adjust', { id, delta, reason: 'Manual adjustment' });
      item.quantity = val;
      if (!item.history) item.history = [];
      item.history.push({ delta, old_qty: val - delta, new_qty: val, reason: 'Manual adjustment', created_at: new Date().toISOString() });
      editingId = null;
      renderInventory();
      toast('Saved');
    } catch (e) { toast('Save failed'); }
  }
  function quickPick(id) {
    toast('Use Pick Lists tab for machine picks');
  }

  // ---- Add Stock ----
  function renderAddStock() {
    const sel = document.getElementById('asItem');
    sel.innerHTML = '<option value="">Select item...</option>' +
      inventory.map(it => `<option value="${esc(it.id)}">${esc(it.name)}</option>`).join('');
    renderAddStockLog();
  }
  async function addStock() {
    const id = document.getElementById('asItem').value;
    const qty = parseInt(document.getElementById('asQty').value || 0);
    const source = document.getElementById('asSource').value;
    if (!id || qty <= 0) { toast('Select item and quantity'); return; }
    try {
      await api('POST', '/api/office-inventory/adjust', { id, delta: qty, reason: `Received from ${source}` });
      const item = inventory.find(i => i.id === id);
      addStockHistory.unshift({ name: item.name, qty, source, time: new Date().toLocaleString() });
      item.quantity += qty;
      renderInventory();
      renderAddStockLog();
      document.getElementById('asQty').value = 1;
      toast(`Added ${qty} ${item.name}`);
    } catch (e) { toast('Failed to add stock'); }
  }
  function renderAddStockLog() {
    const el = document.getElementById('addStockLog');
    if (!addStockHistory.length) { el.innerHTML = '<div class="empty">No recent additions</div>'; return; }
    el.innerHTML = addStockHistory.slice(0, 20).map(l => `
      <div class="log-entry">
        <div><strong>+${l.qty}</strong> ${esc(l.name)} <span style="color:var(--muted)">from ${esc(l.source)}</span></div>
        <div class="time">${esc(l.time)}</div>
      </div>
    `).join('');
  }

  // ---- Pick Lists (Machine-specific) ----
  async function refreshAllPickLists() {
    const btn = document.getElementById('refreshBtn');
    btn.disabled = true;
    btn.textContent = '↻ Refreshing…';
    try {
      const r = await api('POST', '/api/pick-lists/refresh-all');
      pickLists = r.lists || pickLists;
      renderPickLists();
      toast(`✓ All pick lists updated`);
    } catch (e) {
      const msg = e.message || '';
      if (msg.includes('503')) toast('No stock data yet — sync runs at 6am daily');
      else toast('Refresh failed');
      console.error(e);
    } finally {
      btn.disabled = false;
      btn.textContent = '↻ Refresh Stock';
    }
  }

  function renderPickLists() {
    const el = document.getElementById('pickListsContainer');
    const lists = [...pickLists].sort((a, b) => (a.label||'').localeCompare(b.label||''));
    if (!lists.length) { el.innerHTML = '<div class="empty" style="color:var(--muted);font-size:0.85rem;padding:12px 0;">Tap Refresh Stock to load pick lists.</div>'; return; }

    el.innerHTML = lists.map(pl => {
      const isExpanded = pl._expanded;
      const allPacked = pl.items.length > 0 && pl.items.every(it => it.checked);
      const packedCount = pl.items.filter(it => it.checked).length;

      return `
        <div class="pl-card">
          <div class="pl-header" onclick="togglePl('${pl.id}')">
            <div>
              <div class="pl-title">${esc(pl.label)}</div>
              <div class="pl-meta">${pl.items.length} items · ${packedCount}/${pl.items.length} packed · updated ${pl.synced_at ? new Date(pl.synced_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) : 'never'}</div>
            </div>
          </div>
          ${isExpanded ? renderPlItems(pl) : ''}
        </div>
      `;
    }).join('');
  }

  function renderPlItems(pl) {
    if (pl.status === 'finalized') {
      return `
        <div class="pl-items">
          ${pl.items.map(it => `
            <div class="pl-item">
              <span class="name">${esc(it.name)}</span>
              <span style="color:var(--muted)">${it.current_qty}/${it.capacity} → need ${it.qty}</span>
            </div>
          `).join('')}
        </div>
        <div class="completed-badge">✓ Completed — ${new Date(pl.finalized_at).toLocaleString()}</div>
        <div class="pl-actions">
          <button class="rollback-btn" onclick="rollbackPl('${pl.id}')">↩ Rollback</button>
          <button class="delete-btn" onclick="deletePl('${pl.id}')">Delete</button>
        </div>
      `;
    }

    if (pl.status === 'rolled_back') {
      return `
        <div class="pl-items">
          ${pl.items.map(it => `
            <div class="pl-item">
              <span class="name">${esc(it.name)}</span>
              <span style="color:var(--muted)">need ${it.qty}</span>
            </div>
          `).join('')}
        </div>
        <div class="completed-badge" style="background:var(--red);">↩ Rolled Back — ${new Date(pl.rolled_back_at).toLocaleString()}</div>
      `;
    }

    // Draft — show checkboxes
    const allPacked = pl.items.length > 0 && pl.items.every(it => it.checked);
    const missingHtml = pl.missing?.length ? `
      <div class="missing-banner">
        <strong>${pl.missing.length} items not in office inventory:</strong>
        ${pl.missing.filter(m => m.product_name).map(m => `${esc(m.product_name)}${m.needed ? ' (need '+m.needed+')' : ''}`).join(', ')}
      </div>
    ` : '';

    return `
      ${missingHtml}
      <div class="pl-actions" style="margin-bottom:8px;">
        <button onclick="openReplaceModal()" style="width:100%;padding:8px;background:#dcfce7;border:1px solid #86efac;border-radius:8px;font-size:0.8rem;font-weight:600;color:#166534;cursor:pointer;">+ Add / Replace Item</button>
      </div>
      <div class="pl-items">
        ${pl.items.map(it => {
          const inv = inventory.find(i => i.id === it.id);
          const officeQty = inv ? inv.quantity : null;
          const cantFulfill = officeQty !== null && officeQty === 0;
          const picUrl = getPicUrl(it.picture);
          const thumb = thumbHtml(picUrl, 32);
          return `
            <div class="pl-item">
              <input type="checkbox" class="chk" ${it.checked ? 'checked' : ''}
                onchange="togglePacked('${pl.id}', '${it.id}', this.checked)">
              ${thumb}
              <span class="name">${esc(it.name)}</span>
              <span style="color:var(--muted);font-size:0.75rem;">${it.current_qty}/${it.capacity}</span><button
                data-plid="${esc(pl.id)}" data-itemid="${esc(it.id)}"
                data-product="${esc(it.sandstar_product_name||it.name)}"
                data-machine="${esc(pl.machine_names?.[0]||pl.label)}"
                data-cap="${it.max_qty||it.capacity}"
                onclick="editCapacityBtn(event,this)"
                style="margin-left:3px;padding:2px 6px;font-size:0.65rem;border-radius:5px;${it.max_qty && it.max_qty !== it.capacity ? 'border:1px solid #3b82f6;background:#dbeafe;color:#1e40af;' : 'border:1px solid #86efac;background:#dcfce7;color:#166534;'}cursor:pointer;font-weight:600;">${it.max_qty && it.max_qty !== it.capacity ? 'max:'+it.max_qty : 'max'}</button>
              <div style="display:flex;align-items:center;gap:3px;">
                <button onclick="adjNeed(event,'${pl.id}','${it.id}',-1)" style="width:22px;height:22px;border-radius:50%;border:1px solid var(--border);background:var(--card);font-size:0.9rem;line-height:1;cursor:pointer;padding:0;">−</button>
                <span class="need ${cantFulfill ? 'warn' : ''}" id="need-${pl.id}-${it.id}">${it.qty}</span>
                <button onclick="adjNeed(event,'${pl.id}','${it.id}',1)" style="width:22px;height:22px;border-radius:50%;border:1px solid var(--border);background:var(--card);font-size:0.9rem;line-height:1;cursor:pointer;padding:0;">+</button>
              </div>
              ${it.packed_at ? `<span class="packed-at">Packed ${new Date(it.packed_at).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}</span>` : ''}
            </div>
          `;
        }).join('')}
      </div>
      <div class="pl-actions">
        <button class="done-btn" onclick="donePacking('${pl.id}')" ${allPacked ? '' : 'disabled'}>
          ${allPacked ? '✓ DONE PACKING' : `Packed ${pl.items.filter(it=>it.checked).length}/${pl.items.length}`}
        </button>
      </div>
      <div class="pl-actions">
        <button class="delete-btn" onclick="deletePl('${pl.id}')">Delete</button>
      </div>
    `;
  }

  function togglePl(id) {
    const pl = pickLists.find(l => l.id === id);
    if (pl) { pl._expanded = !pl._expanded; renderPickLists(); }
  }

  function editCapacityBtn(e, btn) {
    editCapacity(e, btn.dataset.plid, btn.dataset.itemid, btn.dataset.product, btn.dataset.machine, parseFloat(btn.dataset.cap)||0);
  }

  async function editCapacity(e, plId, itemId, productName, machineName, currentCap) {
    e.stopPropagation();
    const newCap = prompt(`Set real max capacity for "${productName}" at ${machineName}:`, currentCap);
    if (newCap === null) return;
    const cap = parseInt(newCap);
    if (isNaN(cap) || cap < 0) { toast('Invalid capacity'); return; }
    try {
      await api('POST', '/api/capacity-overrides', { machine_name: machineName, product_name: productName, capacity: cap });
      capacityOverrides[`${machineName}|${productName}`] = cap;
      toast(`Max set to ${cap} — refreshing pick list...`);
      // Refresh pick lists to apply new capacity
      const r = await api('POST', '/api/pick-lists/refresh-all');
      pickLists = r.lists || pickLists;
      renderPickLists();
    } catch(err) { toast('Save failed'); }
  }

  async function adjNeed(e, plId, itemId, delta) {
    e.stopPropagation();
    const pl = pickLists.find(l => l.id === plId);
    if (!pl) return;
    const item = pl.items.find(it => it.id === itemId);
    if (!item) return;
    item.qty = Math.max(0, (item.qty || 0) + delta);
    const el = document.getElementById(`need-${plId}-${itemId}`);
    if (el) el.textContent = item.qty;
    try {
      await api('PUT', `/api/pick-lists/${plId}/pack`, {
        packed_items: pl.items.map(it => ({ id: it.id, checked: !!it.checked })),
        qty_overrides: [{ id: itemId, qty: item.qty }]
      });
    } catch(e2) { toast('Save failed'); }
  }

  async function togglePacked(plId, itemId, checked) {
    const pl = pickLists.find(l => l.id === plId);
    if (!pl) return;
    const item = pl.items.find(it => it.id === itemId);
    if (item) {
      item.checked = checked;
      if (checked && !item.packed_at) item.packed_at = new Date().toISOString();
      if (!checked) delete item.packed_at;
    }
    // Save to server
    try {
      await api('PUT', `/api/pick-lists/${plId}/pack`, {
        packed_items: pl.items.map(it => ({ id: it.id, checked: !!it.checked }))
      });
      renderPickLists();
    } catch (e) { toast('Save failed'); }
  }

  async function donePacking(id) {
    if (!confirm('Finalize this pick list and deduct from inventory?')) return;
    try {
      const pl = await api('PUT', `/api/pick-lists/${id}/finalize`);
      const idx = pickLists.findIndex(l => l.id === id);
      if (idx >= 0) pickLists[idx] = { ...pickLists[idx], ...pl };
      await loadData();
      if (pl.sheet_errors?.length) {
        toast(`Pick list done! Sheet sync issues: ${pl.sheet_errors.length}`);
      } else {
        toast('Pick list completed & synced');
      }
    } catch (e) {
      const msg = e.message || '';
      if (msg.includes('Insufficient')) toast('Insufficient stock');
      else if (msg.includes('No items checked')) toast('Check all items first');
      else toast('Finalize failed');
    }
  }

  async function rollbackPl(id) {
    if (!confirm('Rollback this pick list? Quantities will be restored.')) return;
    try {
      const pl = await api('POST', `/api/pick-lists/${id}/rollback`);
      const idx = pickLists.findIndex(l => l.id === id);
      if (idx >= 0) pickLists[idx] = { ...pickLists[idx], ...pl };
      await loadData();
      toast('Rolled back');
    } catch (e) { toast('Rollback failed'); }
  }

  async function deletePl(id) {
    try {
      await api('DELETE', `/api/pick-lists/${id}`);
      pickLists = pickLists.filter(l => l.id !== id);
      renderPickLists();
      toast('Deleted');
    } catch (e) { toast('Delete failed'); console.error(e); }
  }

  // ---- Toast ----
  let toastT;
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastT);
    toastT = setTimeout(() => el.classList.remove('show'), 2500);
  }

  // Init
  showApp();
</script>
</body>
</html>
